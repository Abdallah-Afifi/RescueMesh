# Throughput as concurrent clients increase: closed loop, 5 seeds.
#
#   python experiments/run_sweep.py experiments/sweeps/clients.toml --machines experiments/machines.toml
#
# Each user has one request outstanding and no think time, so throughput rises
# with users until the cloud saturates, then flattens while latency grows: the
# peak-throughput curve (protocol Section 10). Concurrent users = users x 4
# processes x 3 client machines: 60, 120, 300, 600, 1200, 2400. analyze.py
# plots it as figures/throughput_vs_clients.png from meta.json.
#
# 2 policies x 6 levels x 5 seeds = 60 runs of about 85 s:
# ESTIMATED WALL-CLOCK TIME ABOUT 1 h 25 min (MWBE alone: `--only mwbe`, 43 min).
# Check the client machines' CPU in the resource figures: if a client machine
# is near 100%, the limit is on the client side, not the cloud (Section 1.4).
name = "clients"
base_config = "config/cluster.toml"
seeds = [1, 2, 3, 4, 5]
warmup_secs = 10
duration_secs = 30
drain_secs = 5
settle_secs = 3
x_name = "users per process (x 4 processes x 3 machines)"

[loadgen]
processes = 4
mode = "closed"
think_ms = 0
mix = "report=60,offer=20,update=15,query=5"


[config]
# Controlled failures only: the base config turns periodic injection on for the demo.
"inject.enabled" = false

[[run]]
label = "mwbe-u5"
series = "mwbe_cached"
x = 5
config = { "policy.ranker" = "mwbe_cached" }
loadgen = { users = 5 }
