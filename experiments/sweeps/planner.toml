# The planner's cost knob (planner.top_k, plan workstream D): service time
# against the knob, and what it does to request latency, at one fixed
# moderate open-loop rate. analyze.py reports plan service time (mean, p50,
# p99) per configuration in tables/service_by_config.csv and summary.md; the
# load-curve figure of this sweep has top_k on its x axis.
#
#   python experiments/run_sweep.py experiments/sweeps/planner.toml --machines experiments/machines.toml
#
# 4 knob settings x 5 seeds = 20 runs of about 85 s: ESTIMATED WALL-CLOCK TIME ABOUT 30 min.
# The rate should be well below saturation at top_k 100 (see clients.toml).
name = "planner"
base_config = "config/cluster.toml"
seeds = [1, 2, 3, 4, 5]
warmup_secs = 10
duration_secs = 30
drain_secs = 5
settle_secs = 3
x_name = "planner cost knob top_k (500 ops/s, MWBE)"

[loadgen]
processes = 4
users = 50
mode = "open"
rate = 500
mix = "report=60,offer=20,update=15,query=5"

[config]
"policy.ranker" = "mwbe_cached"
# Controlled failures only: the base config turns periodic injection on for the demo.
"inject.enabled" = false

[[run]]
label = "topk10"
series = "MWBE, top_k"
x = 10
config = { "planner.top_k" = 10 }
[[run]]
label = "topk50"
series = "MWBE, top_k"
x = 50
config = { "planner.top_k" = 50 }
[[run]]
label = "topk100"
series = "MWBE, top_k"
x = 100
config = { "planner.top_k" = 100 }
[[run]]
label = "topk200"
series = "MWBE, top_k"
x = 200
config = { "planner.top_k" = 200 }
