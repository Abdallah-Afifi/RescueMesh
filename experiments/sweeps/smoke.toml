# Smoke test of the runner (about 1.5 minutes). ALWAYS give it its own --out,
# so its runs never sit next to the report's in results/raw:
#   python experiments/run_sweep.py experiments/sweeps/smoke.toml --local --out results/dev/smoke
#   python experiments/run_sweep.py experiments/sweeps/smoke.toml --base-config config/cluster.toml --out results/dev/smoke
# Two silences and a load-knob episode in a 24 s measured window. Its series
# and x_name are its own, so even analysed together with the report's runs it
# cannot land on a report curve. Not for the report.
name = "smoke"
base_config = "config/local.toml"
seeds = [1]
warmup_secs = 3
duration_secs = 24
drain_secs = 3
settle_secs = 1
start_lead_ms = 3000
x_name = "smoke test (not for the report)"

[loadgen]
processes = 2
users = 10
mode = "open"
rate = 150
mix = "report=60,offer=20,update=15,query=5"

[[failure]]
at_s = 4
target = "coordinator"
duration_ms = 3000

[[failure]]
at_s = 15
target = "rank1"
duration_ms = 3000

[[load_knob]]
at_s = 9
node = 2
threads = 4
duty = 900
duration_ms = 4000

[config]
# Controlled failures only: the base config turns periodic injection on for the demo.
"inject.enabled" = false

[[run]]
label = "mwbe"
series = "smoke"
x_name = "smoke test (not for the report)"
config = { "policy.ranker" = "mwbe_cached" }
