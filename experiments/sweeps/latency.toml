# Latency against offered load: MWBE against every baseline, open loop, 5 seeds.
#
#   python experiments/run_sweep.py experiments/sweeps/latency.toml --machines experiments/machines.toml
#   python analysis/analyze.py results/raw --out results/summary
#
# 6 policies x 4 loads x 5 seeds = 120 runs of about 85 s (10 s warm-up + 30 s
# measured + 5 s drain + about 40 s start-up, readiness, stop and log copy):
# ESTIMATED WALL-CLOCK TIME ABOUT 2 h 50 min. Seeds are the outer loop, so after
# about 35 min every configuration has one seed; `--seeds 1,2` or `--only mwbe`
# cut it down, and rerunning the same command resumes.
#
# Open loop: the offered load does not slow down when the system does, so the
# latency curve has no coordinated omission (DL-043). `rate` is the total over
# all client machines. Calibrate the levels first: the highest one should be
# near saturation (see clients.toml), the lowest well below it. Each run has
# 30 s x rate measured requests, so 5 seeds give 30,000 or more per configuration
# from 200 ops/s up.
name = "latency"
base_config = "config/cluster.toml"
seeds = [1, 2, 3, 4, 5]
warmup_secs = 10
duration_secs = 30
drain_secs = 5
settle_secs = 3
x_name = "offered load (ops/s)"

[loadgen]
processes = 4
users = 50
mode = "open"
mix = "report=60,offer=20,update=15,query=5"


[config]
# Controlled failures only: the base config turns periodic injection on for the demo.
"inject.enabled" = false

[[run]]
label = "mwbe-r200"
series = "mwbe_cached"
x = 200
config = { "policy.ranker" = "mwbe_cached" }
loadgen = { rate = 200 }
