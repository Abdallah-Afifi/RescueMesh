# Example sweep: latency and throughput against offered load, with a failure
# injected in every run. The sweeps for the report are in experiments/sweeps/
# (latency, clients, failure, imbalance, autoinject); this file is kept as a
# short template. 20 runs of about 2 min: ESTIMATED WALL-CLOCK TIME ABOUT 40 min.
#   python experiments/run_sweep.py experiments/example-sweep.toml
#   python experiments/run_sweep.py experiments/example-sweep.toml --local --stub   # one machine
name = "load"
base_config = "config/cluster.example.toml"
seeds = [1, 2, 3, 4, 5]          # at least five per configuration (protocol Section 10)
warmup_secs = 10
duration_secs = 60
drain_secs = 20
settle_secs = 3

[loadgen]                         # defaults for every configuration
processes = 4                     # K processes per client machine
users = 50                        # M users per process
mode = "open"                     # open loop for latency curves; "closed" for peak throughput
mix = "report=60,offer=20,update=15,query=5"

[failure]                         # optional; remove for failure-free runs
enabled = true
at_s = 20                         # seconds into the measured window
target = "rank1"                  # node id, "coordinator" or "rank1"
duration_ms = 10000

# rate = total offered load across all client machines, operations per second.

[config]
# Controlled failures only: the base config turns periodic injection on for the demo.
"inject.enabled" = false

[[run]]
label = "mwbe-r200"
series = "mwbe_cached"
x = 200
x_name = "offered load (ops/s)"
config = { "policy.ranker" = "mwbe_cached" }
loadgen = { rate = 200 }

[[run]]
label = "mwbe-r400"
series = "mwbe_cached"
x = 400
x_name = "offered load (ops/s)"
config = { "policy.ranker" = "mwbe_cached" }
loadgen = { rate = 400 }

[[run]]
label = "hash-r200"
series = "hash"
x = 200
x_name = "offered load (ops/s)"
config = { "policy.ranker" = "hash" }
loadgen = { rate = 200 }

[[run]]
label = "hash-r400"
series = "hash"
x = 400
x_name = "offered load (ops/s)"
config = { "policy.ranker" = "hash" }
loadgen = { rate = 400 }
