[workspace]
resolver = "3"
members = ["crates/proto", "crates/node", "crates/client", "crates/loadgen", "crates/ctl", "crates/replication", "crates/selection", "crates/incident"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
proto = { path = "crates/proto" }
client = { path = "crates/client" }
loadgen = { path = "crates/loadgen" }
replication = { path = "crates/replication" }
selection = { path = "crates/selection" }
incident = { path = "crates/incident" }
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
serde_json = "1.0.154"
toml = "1.1.8"
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync"] }
sysinfo = { version = "0.37.2", default-features = false, features = ["system", "network"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
