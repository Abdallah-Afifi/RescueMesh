# The university lab (no ssh between the machines, docs/deployment.md
# section 10). Set the three cloud machines' primary IPv4 addresses (the
# `inet` line on the Ethernet interface that is not `secondary`), commit and
# push, and `git pull` on all six: experiments/lab_run.py needs the same file
# on every machine. University DHCP can change the addresses: check them at
# the start of each session (lab_run.py check says if a cloud role's address
# does not match).
# Every value not shown here takes the agreed default (crates/proto/src/config.rs).

[run]
run_id = "lab"
seed = 42
log_dir = "logs"
wire_format = "postcard"   # "json" to read traffic while debugging

[[cluster.nodes]]
id = 1
host = "10.7.57.XX1"  # cloud1: replace with its IP
port = 7000
heartbeat_port = 7100

[[cluster.nodes]]
id = 2
host = "10.7.57.XX2"  # cloud2: replace with its IP
port = 7000
heartbeat_port = 7100

[[cluster.nodes]]
id = 3
host = "10.7.57.XX3"  # cloud3: replace with its IP
port = 7000
heartbeat_port = 7100

[timeouts]
heartbeat_ms = 100
fd_min_ms = 300
fd_max_ms = 1000
lease_ms = 250

[policy]
ranker = "mwbe_cached"   # random | hash | round_robin | two_choices | highest_id (baselines)

[planner]
top_k = 100              # cost knob

# Periodic fault injection (spec p. 3, protocol Section 8): the coordinator
# silences one node, chosen from a hash of the seed and an injection counter,
# for a random 1-20 s every 45-75 s, and only while all three are ACTIVE.
# On for the demo. Sweeps set it explicitly: off for controlled `rm-ctl
# silence` failures, on for experiments/sweeps/autoinject.toml.
[inject]
enabled = true
interval_min_ms = 45000
interval_max_ms = 75000
duration_min_ms = 1000
duration_max_ms = 20000
