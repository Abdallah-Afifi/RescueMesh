[package]
name = "loadgen"
version = "0.1.0"
description = "Workload generator, client-machine frontend and stand-in cloud (workstream E)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "rm-loadgen"
path = "src/main.rs"

[[bin]]
name = "rm-stub"
path = "src/bin/stub.rs"

[dependencies]
proto.workspace = true
client.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync", "process", "signal"] }
sysinfo = { version = "0.37", default-features = false, features = ["system", "network"] }

[lints]
workspace = true
