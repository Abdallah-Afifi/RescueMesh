[package]
name = "node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rm-node"
path = "src/main.rs"

[dependencies]
proto.workspace = true
replication.workspace = true
selection.workspace = true
# Event-log writer (client::EventLog) and resource/clock samplers
# (loadgen::sampler), shared with the client side so every process logs the
# same way (design log DL-054).
client.workspace = true
loadgen.workspace = true
serde_json.workspace = true
clap.workspace = true
sysinfo.workspace = true
# Workstream D: the real state machine and planner rm-node runs.
incident.workspace = true
tokio = { workspace = true, features = ["signal"] }

[lints]
workspace = true
